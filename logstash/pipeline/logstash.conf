input {
  http {
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "source_application" => "iot-log-monitoring"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "iot-logs-test"
  }

  stdout {
    codec => rubydebug
  }
}
